name: CI-CD Catalog API

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: fcg-api-catalog
  WORKER_IMAGE_NAME: fcg-worker-catalog
  DEPLOYMENT_NAME: fcg-catalog-api
  CONTAINER_NAME: fcg-catalog-api
  WORKER_DEPLOYMENT_NAME: fcg-catalog-worker
  WORKER_CONTAINER_NAME: fcg-catalog-worker

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FCG.Catalog.slnx

      - name: Build
        run: dotnet build FCG.Catalog.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FCG.Catalog.slnx --configuration Release --no-build --verbosity normal

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Catalog API image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest -f Dockerfile .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Build & Push Catalog Worker image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.WORKER_IMAGE_NAME }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest -f Dockerfile.worker .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Security scan API (Trivy)
        continue-on-error: true
        run: |
          docker run --rm aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy Catalog API Rolling Update
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.CONTAINER_NAME }}=$IMAGE
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=180s

      - name: Deploy Catalog Worker Rolling Update
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.WORKER_IMAGE_NAME }}:${{ github.sha }}
          kubectl set image deployment/${{ env.WORKER_DEPLOYMENT_NAME }} \
            ${{ env.WORKER_CONTAINER_NAME }}=$IMAGE
          kubectl rollout status deployment/${{ env.WORKER_DEPLOYMENT_NAME }} --timeout=180s
